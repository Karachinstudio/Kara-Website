<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kara Chin | Artist</title>
  <meta name="description" content="Kara Chin is an artist working across ceramics, installation, animation and video." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="home-page">
  <header class="site-header">
    <a class="site-title" href="index.html">Kara Chin</a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="work.html?feed=top">Work</a>
      <a href="cv.html">CV</a>
    </nav>
  </header>

  <main class="home-layout">
    <div class="homepage-game-block">
      <section class="homepage-game" aria-label="Ginger Cat Dance game">
        <iframe
          id="ginger-cat-game"
          src="ginger-cat-dance-web/index.html"
          title="Ginger Cat Dance"
          loading="eager"
          allow="autoplay"
        ></iframe>
      </section>
      <button class="game-sound-toggle" type="button" aria-pressed="true">Sound On</button>
    </div>
    <section class="on-now">
      <h2>On Now</h2>

      <p>
        <a class="on-now-link" href="https://www.ikon-gallery.org/" target="_blank" rel="noreferrer">
          <img
            class="on-now-preview"
            src="on-now/break-the-mould-landscape.jpg"
            alt=""
            loading="lazy"
          />
          Break the Mould<br />
          Ikon Gallery, Birmingham UK
        </a><br />
        25th March - 6th September 2026
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="#" data-copy-email="studio@karachin.co.uk">studio@karachin.co.uk</a></p>
    <p><a href="https://www.instagram.com/karachin/" target="_blank" rel="noreferrer">@karachin</a></p>
  </footer>

  <script src="copy-email.js"></script>
  <script>
    const gameFrame = document.getElementById("ginger-cat-game");
    const gameSoundToggle = document.querySelector(".game-sound-toggle");
    const desktopGameSrc = "ginger-cat-dance-web/index.html";
    const mobileGameSrc = "ginger-cat-dance-web/Mobile/mobile.html";
    const gameSoundStorageKey = "karaChinGameSound";
    let gameMusicOn = localStorage.getItem(gameSoundStorageKey) !== "off";
    let soundAttentionTimeout = null;

    function shouldUseMobileGame() {
      return window.matchMedia("(pointer: coarse)").matches;
    }

    function updateGameFrameSource() {
      const useMobileGame = shouldUseMobileGame();
      const nextSrc = useMobileGame ? mobileGameSrc : desktopGameSrc;
      document.body.classList.toggle("uses-mobile-game", useMobileGame);

      if (!gameFrame.getAttribute("src").endsWith(nextSrc)) {
        gameSoundToggle.classList.remove("is-ready");
        gameFrame.src = nextSrc;
      }
    }

    function updateGameSound() {
      gameSoundToggle.textContent = "Sound On";
      gameSoundToggle.classList.toggle("is-off", !gameMusicOn);
      gameSoundToggle.setAttribute("aria-pressed", String(gameMusicOn));
      gameSoundToggle.setAttribute("aria-label", gameMusicOn ? "Turn sound off" : "Turn sound on");

      if (gameFrame.contentWindow) {
        let updatedDirectly = false;

        try {
          if (typeof gameFrame.contentWindow.setGameMusicEnabled === "function") {
            gameFrame.contentWindow.setGameMusicEnabled(gameMusicOn);
            updatedDirectly = true;
          }
        } catch (error) {
          console.log("Direct music toggle failed:", error);
        }

        if (!updatedDirectly) {
          gameFrame.contentWindow.postMessage({ type: "setMusic", enabled: gameMusicOn }, "*");
        }
      }
    }

    gameSoundToggle.addEventListener("click", () => {
      clearTimeout(soundAttentionTimeout);
      gameSoundToggle.classList.remove("is-attention");
      gameMusicOn = !gameMusicOn;
      localStorage.setItem(gameSoundStorageKey, gameMusicOn ? "on" : "off");
      updateGameSound();
    });

    gameFrame.addEventListener("load", updateGameSound);
    document.addEventListener("pointerdown", () => {
      if (gameMusicOn && gameFrame.contentWindow) {
        gameFrame.contentWindow.setGameMusicEnabled?.(true);
      }
    }, { once: true });
    window.addEventListener("message", (event) => {
      if (event.source === gameFrame.contentWindow && event.data?.type === "gameReady") {
        gameSoundToggle.classList.add("is-ready");
        gameSoundToggle.classList.add("is-attention");
        clearTimeout(soundAttentionTimeout);
        soundAttentionTimeout = window.setTimeout(() => {
          gameSoundToggle.classList.remove("is-attention");
        }, 5000);
      }
    });
    window.addEventListener("resize", updateGameFrameSource);
    updateGameSound();
    updateGameFrameSource();
  </script>
</body>
</html>
