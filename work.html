<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kara Chin | Artist</title>
  <meta name="description" content="Kara Chin is an artist working across ceramics, installation, animation and video." />
  <link rel="stylesheet" href="styles.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BHB731RGFH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BHB731RGFH');

<body class="work-index-page">
  <header class="site-header">
    <a class="site-title" href="index.html">Kara Chin</a>

    <nav class="site-nav" aria-label="Main navigation">
      <a class="is-current" href="work.html?feed=top&open=first">Work</a>
      <a href="cv.html">CV</a>
    </nav>
  </header>

  <main class="home-layout">
    <aside class="image-feed" aria-label="Selected work image feed"></aside>
  </main>

  <footer class="site-footer">
    <p><a href="#" data-copy-email="studio@karachin.co.uk">studio@karachin.co.uk</a></p>
    <p><a href="https://www.instagram.com/karachin/" target="_blank" rel="noreferrer">@karachin</a></p>
  </footer>

  <script src="copy-email.js"></script>
  <script src="work-list.js"></script>
  <script>
    const imageFeed = document.querySelector(".image-feed");
    const imageFolder = window.WORK_IMAGE_FOLDER || "images/";
    const workList = window.WORK_LIST || [];

    function animateFeedEntranceScroll() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      const startScrollTop = Math.min(
        Math.max(imageFeed.scrollTop, 720),
        imageFeed.scrollHeight - imageFeed.clientHeight
      );
      const targetScrollTop = 0;
      const duration = 1200;
      const startTime = performance.now();

      imageFeed.scrollTop = startScrollTop;

      function step(currentTime) {
        const progress = Math.min((currentTime - startTime) / duration, 1);
        const easedProgress = 1 - Math.pow(1 - progress, 3);
        imageFeed.scrollTop = startScrollTop + (targetScrollTop - startScrollTop) * easedProgress;

        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }

      requestAnimationFrame(step);
    }

    function titleFromFile(file) {
      const filename = file.split("/").pop().replace(/\.[^.]+$/, "");
      const cleaned = filename
        .replace(/^\d+\s*[-_. ]\s*/, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      if (cleaned === cleaned.toLowerCase() || cleaned === cleaned.toUpperCase()) {
        return cleaned.replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      return cleaned;
    }

    function imagePath(file) {
      if (/^(https?:)?\/\//.test(file) || file.includes("/")) {
        return file;
      }

      return `${imageFolder}${file}`;
    }

    function normaliseWork(item) {
      const file = typeof item === "string" ? item : item.file;

      return {
        file,
        src: imagePath(file),
        title: typeof item === "string" ? titleFromFile(file) : item.title || titleFromFile(file),
        href: typeof item === "string" ? "" : item.href || "",
        alt: typeof item === "string" ? "" : item.alt || ""
      };
    }

    const works = workList.map(normaliseWork);

    works.forEach((work) => {
      const item = document.createElement("article");
      const link = document.createElement("a");
      const image = document.createElement("img");
      const title = document.createElement("span");

      item.className = "feed-item";
      link.href = work.href || "#";
      image.className = "is-loading";
      image.loading = "lazy";
      image.decoding = "async";
      image.src = work.src;
      image.alt = work.alt || work.title;
      title.textContent = work.title;

      if (image.complete) {
        image.classList.remove("is-loading");
        image.classList.add("is-loaded");
      } else {
        image.addEventListener("load", () => {
          image.classList.remove("is-loading");
          image.classList.add("is-loaded");
        }, { once: true });
        image.addEventListener("error", () => {
          image.classList.remove("is-loading");
        }, { once: true });
      }

      link.append(image, title);
      item.append(link);
      imageFeed.append(item);

      link.addEventListener("click", (event) => {
        if (!work.href) {
          event.preventDefault();
        }
      });
    });

    function openFirstWorkAfterMenuLoads() {
      const params = new URLSearchParams(window.location.search);
      const shouldOpenFirstWork = params.get("open") === "first";
      const isDesktop = window.matchMedia("(min-width: 701px)").matches;
      const firstWork = works.find((work) => work.href);

      if (!shouldOpenFirstWork || !isDesktop || !firstWork) {
        return;
      }

      window.setTimeout(() => {
        window.location.href = firstWork.href;
      }, 1000);
    }

    requestAnimationFrame(() => {
      requestAnimationFrame(animateFeedEntranceScroll);
    });

    openFirstWorkAfterMenuLoads();

    document.querySelectorAll(".site-title, .site-nav a:not(.is-current)").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();
        document.body.classList.add("is-leaving-work");

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          window.location.href = link.href;
          return;
        }

        window.setTimeout(() => {
          window.location.href = link.href;
        }, 400);
      });
    });
  </script>
  <script src="feed-scroll-memory.js"></script>
</body>
</html>
