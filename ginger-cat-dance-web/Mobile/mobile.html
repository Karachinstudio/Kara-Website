<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Install Mobile</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      cursor: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #video {
      position: fixed;
      left: 0;
      top: -4px;
      width: calc(100vw + 32px);
      height: calc(100vh + 8px);
      display: block;
      object-fit: fill;
      z-index: 1;
      background: black;
    }

    #flash {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* moved ABOVE the flash */
    #overlayLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .clickOverlay {
      position: fixed;
      display: block;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%);
      background: transparent;
      background-color: transparent;
    }

    #cursor {
      display: none;
      position: fixed;
      width: 60px;
      height: 60px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      left: 50vw;
      top: 50vh;
      background-color: hotpink;
      border-radius: 50%;
      box-shadow: 0 0 12px hotpink;
      background-image: url("mouse.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      color: #ef7777;
      background: #000 url("../place-holder.jpeg") center / cover no-repeat;
      padding: 18px;
      text-align: center;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #loadingScreen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loadingCopy {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .loadingDots {
      display: inline-block;
      width: 0;
      overflow: hidden;
      vertical-align: bottom;
      white-space: nowrap;
      animation: loading-dots 1.2s steps(4, end) infinite;
    }

    #loadingLabel[hidden],
    #loadingMessage:empty {
      display: none;
    }

    @keyframes loading-dots {
      to {
        width: 1.5em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loadingDots {
        width: 1.5em;
        animation: none;
      }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BHB731RGFH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BHB731RGFH');
  </script>
</head>
<body>
  <video id="video" autoplay muted playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
  <audio id="bgmusic" src="../music.mp3" loop preload="none"></audio>
  <div id="flash"></div>
  <div id="overlayLayer"></div>
  <div id="cursor"></div>
  <div id="loadingScreen" role="status" aria-live="polite">
    <div class="loadingCopy">
      <span id="loadingLabel">loading<span class="loadingDots" aria-hidden="true">...</span></span>
      <span id="loadingMessage"></span>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const bgmusic = document.getElementById("bgmusic");
    const flash = document.getElementById("flash");
    const overlayLayer = document.getElementById("overlayLayer");
    const cursor = document.getElementById("cursor");
    const loadingScreen = document.getElementById("loadingScreen");
    const loadingLabel = document.getElementById("loadingLabel");
    const loadingMessage = document.getElementById("loadingMessage");

    const idleSrc = "idle.mp4";
    const clickSounds = [
      "../click01.mp3",
      "../click02.mp3",
      "../click03.mp3",
      "../click04.mp3",
      "../click05.mp3",
      "../click06.mp3",
      "../click07.mp3",
      "../click08.mp3",
      "../click09.mp3",
      "../click10.mp3",
      "../click11.mp3"
    ];
    const dances = [
      { src: "dance1.mp4", weight: 0.7 },
      { src: "dance2.mp4", weight: 1 },
      { src: "dance3.mp4", weight: 1 },
      { src: "dance4.mp4", weight: 1 }
    ];

    const idleClickSets = [
      { mov: "click01.mov", webm: "click01.webm", mp3: "click01.mp3" },
      { mov: "click02.mov", webm: "click02.webm", mp3: "click02.mp3" },
      { mov: "click03.mov", webm: "click03.webm", mp3: "click03.mp3" },
      { mov: "click04.mov", webm: "click04.webm", mp3: "click04.mp3" },
      { mov: "click09.mov", webm: "click09.webm", mp3: "click09.mp3" },
      { mov: "click10.mov", webm: "click10.webm", mp3: "click10.mp3" },
      { mov: "click11.mov", webm: "click11.webm", mp3: "click11.mp3" }
    ];

    const danceTriggerSets = [
      { mov: "click05.mov", webm: "click05.webm", mp3: "click05.mp3" },
      { mov: "click06.mov", webm: "click06.webm", mp3: "click06.mp3" },
      { mov: "click07.mov", webm: "click07.webm", mp3: "click07.mp3" },
      { mov: "click08.mov", webm: "click08.webm", mp3: "click08.mp3" }
    ];

    const normalClickSize = 420;
    const danceClickSize = 900;
    const dance4ClickSize = 680;
    const maxActiveOverlays = 3;

    let state = "idle";
    let hasStartedAudio = false;
    let bgMusicStarted = false;
    let flashTimeout = null;
    let ignoreClickUntil = 0;
    let inputLocked = false;
    let currentDance = null;
    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    let activeOverlays = [];
    let activeSounds = [];
    let musicEnabled = false;
    let interactionCount = 0;
    let interactionThreshold = pickInteractionThreshold();
    let hasHiddenLoadingScreen = false;
    let slowLoadingTimeout = null;
    let idleVideoReady = false;
    let gameAssetsReady = false;
    let analyticsGameStarted = false;
    let analyticsGameStartedAt = 0;
    let analyticsInteractionCount = 0;
    let analyticsDanceCount = 0;
    let analyticsEngagementTimer = null;
    const analyticsInteractionMilestones = new Set();
    const analyticsTimeMilestones = new Set();
    const preloadedMedia = [];

    function trackCatGameEvent(eventName, params = {}) {
      if (typeof gtag !== "function") {
        return;
      }

      gtag("event", eventName, {
        event_category: "cat_game",
        game_variant: "mobile",
        ...params
      });
    }

    function reportEngagementTime(force = false) {
      if (!analyticsGameStartedAt) {
        return;
      }

      const seconds = Math.round((Date.now() - analyticsGameStartedAt) / 1000);
      const milestones = [15, 30, 60, 120, 300];

      milestones.forEach((milestone) => {
        if (seconds >= milestone && !analyticsTimeMilestones.has(milestone)) {
          analyticsTimeMilestones.add(milestone);
          trackCatGameEvent("cat_game_engagement_time", {
            value: milestone,
            engagement_seconds: milestone
          });
        }
      });

      if (force && seconds > 0) {
        trackCatGameEvent("cat_game_engagement_time", {
          value: seconds,
          engagement_seconds: seconds,
          final: true
        });
      }
    }

    function markCatGameStarted(inputType) {
      if (analyticsGameStarted) {
        return;
      }

      analyticsGameStarted = true;
      analyticsGameStartedAt = Date.now();
      trackCatGameEvent("cat_game_start", { input_type: inputType });
      analyticsEngagementTimer = window.setInterval(reportEngagementTime, 5000);
    }

    function trackCatGameInteraction(inputType) {
      markCatGameStarted(inputType);
      analyticsInteractionCount += 1;

      [1, 5, 10, 25, 50, 100].forEach((milestone) => {
        if (analyticsInteractionCount >= milestone && !analyticsInteractionMilestones.has(milestone)) {
          analyticsInteractionMilestones.add(milestone);
          trackCatGameEvent("cat_game_interaction_milestone", {
            value: milestone,
            interaction_count: milestone,
            input_type: inputType
          });
        }
      });
    }

    video.disablePictureInPicture = true;
    video.disableRemotePlayback = true;

    function isMobilePlayback() {
      return true;
    }

    function shouldPlayClickSounds() {
      return true;
    }

    function applySoundState() {
      bgmusic.muted = !musicEnabled;
      video.muted = true;
    }

    async function setMusicEnabled(enabled) {
      musicEnabled = false;
      applySoundState();
      bgmusic.pause();
    }

    function hideLoadingScreen() {
      if (hasHiddenLoadingScreen) {
        return;
      }

      hasHiddenLoadingScreen = true;
      clearTimeout(slowLoadingTimeout);
      loadingScreen.classList.add("is-hidden");
      window.parent.postMessage({ type: "gameReady" }, "*");
      trackCatGameEvent("cat_game_ready");
    }

    function showLoadingMessage(message, keepLoading = false) {
      if (!hasHiddenLoadingScreen) {
        loadingLabel.hidden = !keepLoading;
        loadingMessage.textContent = message;
      }
    }

    function finishLoadingWhenReady() {
      if (idleVideoReady && gameAssetsReady) {
        hideLoadingScreen();
      }
    }

    function preloadMedia(src, kind) {
      return new Promise((resolve) => {
        const media = kind === "video" ? document.createElement("video") : new Audio();
        let settled = false;

        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          resolve();
        };

        media.preload = "auto";
        media.src = src;

        if (kind === "video") {
          media.muted = true;
          media.playsInline = true;
        }

        media.addEventListener("loadeddata", finish, { once: true });
        media.addEventListener("error", finish, { once: true });
        const timeout = window.setTimeout(finish, 15000);

        preloadedMedia.push(media);
        media.load();
      });
    }

    async function preloadGameAssets() {
      const assets = [
        ...dances.map((dance) => preloadMedia(dance.src, "video")),
        ...clickSounds.map((src) => preloadMedia(src, "audio"))
      ];

      await Promise.all(assets);
      gameAssetsReady = true;
      finishLoadingWhenReady();
    }

    function pickInteractionThreshold() {
      return Math.floor(Math.random() * 16) + 5;
    }

    async function maybeTriggerKeyboardAction() {
      interactionCount += 1;

      if (interactionCount < interactionThreshold) {
        return;
      }

      interactionCount = 0;
      interactionThreshold = pickInteractionThreshold();
      await handleKeyboardTrigger();
    }

    function pickRandomDance() {
      if (isMobilePlayback()) {
        return Math.random() < 0.5 ? "dance3.mp4" : "dance4.mp4";
      }

      const totalWeight = dances.reduce((sum, dance) => sum + dance.weight, 0);
      let roll = Math.random() * totalWeight;

      for (const dance of dances) {
        roll -= dance.weight;
        if (roll <= 0) {
          return dance.src;
        }
      }

      return dances[dances.length - 1].src;
    }

    function pickRandomIdleClickSet() {
      return idleClickSets[Math.floor(Math.random() * idleClickSets.length)];
    }

    function pickRandomDanceTriggerSet() {
      if (currentDance === "dance1.mp4") {
        return { mov: "click03.mov", webm: "click03.webm", mp3: "click03.mp3" };
      }

      return danceTriggerSets[Math.floor(Math.random() * danceTriggerSets.length)];
    }

    async function startBackgroundMusic() {
      return;
    }

    function setNormalMusicEffect() {
      bgmusic.volume = 0.6;
      bgmusic.playbackRate = 1.0;
    }

    function setDance1MusicEffect() {
      bgmusic.volume = 0.35;
      bgmusic.playbackRate = 0.5;
    }

    function updateMusicEffectForCurrentState() {
      if (!bgMusicStarted) return;

      if (currentDance === "dance1.mp4") {
        setDance1MusicEffect();
      } else {
        setNormalMusicEffect();
      }
    }

    function getCurrentClickSize() {
      const viewportScale = Math.min(window.innerWidth / 720, window.innerHeight / 900, 1);
      let size = normalClickSize;

      if (state === "dance" && currentDance === "dance4.mp4") {
        size = dance4ClickSize;
      } else if (state === "dance") {
        size = danceClickSize;
      }

      return Math.max(180, Math.round(size * viewportScale));
    }

    function playIdle() {
      state = "idle";
      currentDance = null;
      inputLocked = false;
      updateMusicEffectForCurrentState();

      video.src = idleSrc;
      video.loop = true;
      video.muted = true;
      video.volume = 1.0;
      video.currentTime = 0;

      video.play().catch((error) => {
        console.log("Idle play failed:", error);
      });
    }

    function playRandomClickSound() {
      const src = clickSounds[Math.floor(Math.random() * clickSounds.length)];
      const sound = new Audio(src);
      sound.muted = false;
      sound.volume = 0.72;
      sound.playbackRate = 1.0;
      activeSounds.push(sound);

      const removeSound = () => {
        activeSounds = activeSounds.filter((activeSound) => activeSound !== sound);
      };

      sound.addEventListener("ended", removeSound, { once: true });
      sound.addEventListener("error", removeSound, { once: true });
      sound.play().catch((error) => {
        console.log("Mobile click sound failed:", error);
        removeSound();
      });
    }

    function playDance() {
      if (inputLocked) return;

      state = "dance";
      inputLocked = true;
      hasStartedAudio = true;

      const chosenDance = pickRandomDance();
      currentDance = chosenDance;
      analyticsDanceCount += 1;
      trackCatGameEvent("cat_game_dance_start", {
        dance_name: chosenDance,
        dance_count: analyticsDanceCount
      });
      updateMusicEffectForCurrentState();

      video.src = chosenDance;
      video.loop = false;
      video.muted = false;
      video.volume = 1.0;
      video.currentTime = 0;

      video.play().catch((error) => {
        console.log("Dance play failed:", error);
      });

      startBackgroundMusic();
    }

    function flashColor(color, durationMs) {
      clearTimeout(flashTimeout);

      flash.style.background = color;
      flash.style.opacity = "0.5";

      flashTimeout = setTimeout(() => {
        flash.style.opacity = "0";
      }, durationMs);
    }

    function removeOverlay(overlay) {
      activeOverlays = activeOverlays.filter((activeOverlay) => activeOverlay !== overlay);
      overlay.pause();
      overlay.removeAttribute("src");
      overlay.load();
      overlay.remove();
    }

    function trimActiveOverlays() {
      while (activeOverlays.length >= maxActiveOverlays) {
        removeOverlay(activeOverlays[0]);
      }
    }

    function addOverlaySource(overlay, src, type) {
      const source = document.createElement("source");
      source.src = src + "?t=" + Date.now();
      source.type = type;
      overlay.appendChild(source);
    }

    function playOverlay(set, x, y) {
      hasStartedAudio = true;

      trimActiveOverlays();

      const overlay = document.createElement("video");
      overlay.className = "clickOverlay";
      overlay.playsInline = true;
      overlay.disablePictureInPicture = true;
      overlay.disableRemotePlayback = true;
      overlay.controlsList = "nodownload noplaybackrate noremoteplayback";
      overlay.muted = true;
      overlay.src = "click01.mp4?t=" + Date.now();
      overlay.currentTime = 0;
      overlay.loop = false;
      overlay.playbackRate = 1.25;
      overlay.style.left = x + "px";
      overlay.style.top = y + "px";
      overlay.style.width = getCurrentClickSize() + "px";
      overlay.style.backgroundColor = "transparent";
      overlay.preload = "auto";
      overlayLayer.appendChild(overlay);
      activeOverlays.push(overlay);

      const revealOverlay = () => {
        overlay.style.visibility = "visible";
        overlay.style.opacity = "1";
      };

      overlay.addEventListener("playing", revealOverlay, { once: true });

      overlay.play().catch((error) => {
        console.log("click01.mp4 test overlay failed:", error);
        removeOverlay(overlay);
      });

      overlay.addEventListener("ended", () => {
        removeOverlay(overlay);
      });

      overlay.addEventListener("error", () => {
        removeOverlay(overlay);
      });
    }

    function playIdleClickOverlay(x, y) {
      playOverlay(pickRandomIdleClickSet(), x, y);
    }

    function playDanceTriggerOverlay(x, y) {
      playOverlay(pickRandomDanceTriggerSet(), x, y);
    }

    function playKeyOverlay() {
      playDanceTriggerOverlay(cursorX, cursorY);
    }

    async function handleKeyboardTrigger() {
      if (state === "idle") {
        playDance();
      }

      startBackgroundMusic();
    }

    async function handleMouseClick(x, y) {
      playRandomClickSound();
      flashColor("red", 140);
      await maybeTriggerKeyboardAction();
      startBackgroundMusic();
    }

    function vibrateOnTap() {
      if ("vibrate" in navigator) {
        navigator.vibrate(35);
      }
    }

    async function handleTouch(x, y) {
      cursorX = x;
      cursorY = y;
      vibrateOnTap();

      if (isMobilePlayback()) {
        await handleMouseClick(x, y);
        return;
      }

      await handleMouseClick(x, y);
      await maybeTriggerKeyboardAction();
    }

    video.addEventListener("ended", () => {
      if (state === "dance") {
        trackCatGameEvent("cat_game_dance_complete", {
          dance_name: currentDance,
          dance_count: analyticsDanceCount
        });
        playIdle();
      }
    });

    const markIdleVideoReady = () => {
      idleVideoReady = true;
      finishLoadingWhenReady();
    };

    video.addEventListener("canplay", markIdleVideoReady, { once: true });
    video.addEventListener("playing", markIdleVideoReady, { once: true });
    video.addEventListener("error", () => {
      showLoadingMessage("loading failed boooo");
    }, { once: true });
    window.addEventListener("offline", () => {
      showLoadingMessage("the internets broken");
    });
    slowLoadingTimeout = window.setTimeout(() => {
      showLoadingMessage("sloww internet :(", true);
    }, 6000);

    document.addEventListener("click", async (event) => {
      if (Date.now() < ignoreClickUntil) return;
      trackCatGameInteraction("click");
      await handleMouseClick(event.clientX, event.clientY);
    });

    document.addEventListener("contextmenu", async (event) => {
      event.preventDefault();
      if (Date.now() < ignoreClickUntil) return;
      trackCatGameInteraction("contextmenu");
      await handleMouseClick(event.clientX, event.clientY);
    });

    document.addEventListener("keydown", async () => {
      trackCatGameInteraction("keyboard");
      await handleMouseClick(cursorX, cursorY);
    });

    document.addEventListener("touchstart", async (event) => {
      event.preventDefault();
      ignoreClickUntil = Date.now() + 700;
      cursor.style.display = "none";
      const touch = event.touches[0];

      if (touch) {
        trackCatGameInteraction("touch");
        await handleTouch(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    document.addEventListener("mousemove", (event) => {
      cursorX = event.clientX;
      cursorY = event.clientY;
      cursor.style.display = "block";
      cursor.style.left = cursorX + "px";
      cursor.style.top = cursorY + "px";
    });

    window.addEventListener("message", (event) => {
      if (!event.data) {
        return;
      }

      if (event.data.type === "setMusic") {
        setMusicEnabled(Boolean(event.data.enabled));
      } else if (event.data.type === "triggerSoundButtonClick") {
        trackCatGameInteraction("sound_button");
        playIdleClickOverlay(window.innerWidth - 70, window.innerHeight - 70);
        playRandomClickSound();
      }
    });

    window.setGameMusicEnabled = setMusicEnabled;

    window.addEventListener("pagehide", () => {
      reportEngagementTime(true);

      if (analyticsEngagementTimer) {
        window.clearInterval(analyticsEngagementTimer);
      }
    });

    preloadGameAssets();
    playIdle();
  </script>
</body>
</html>
