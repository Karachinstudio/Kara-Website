<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Install</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      cursor: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #video {
      position: fixed;
      left: -2px;
      top: -2px;
      width: calc(100vw + 4px);
      height: calc(100vh + 4px);
      display: block;
      object-fit: fill;
      z-index: 1;
      background: black;
    }

    #flash {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* moved ABOVE the flash */
    #overlayLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .clickOverlay {
      position: fixed;
      height: auto;
      display: block;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%);
      background: transparent;
      background-color: transparent;
    }

    #cursor {
      display: none;
      position: fixed;
      width: 42px;
      height: 42px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      left: 50vw;
      top: 50vh;
      background-color: hotpink;
      border-radius: 50%;
      box-shadow: 0 0 12px hotpink;
      background-image: url("mouse.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: start center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      color: #ef7777;
      background: #eee0e6;
      padding: 36px 24px 24px;
      text-align: center;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #loadingScreen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startPrompt {
      position: fixed;
      inset: 0;
      z-index: 18;
      display: none;
      justify-items: center;
      align-items: start;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      text-align: center;
      background: transparent;
      pointer-events: none;
    }

    #startPrompt.is-visible {
      display: grid;
    }

    #startPrompt span {
      display: block;
      margin-top: 12px;
      animation: start-prompt-flash 1.5s ease-in-out infinite;
    }

    @keyframes start-prompt-flash {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #startPrompt span {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
  <audio id="bgmusic" src="music.mp3" loop preload="none"></audio>
  <div id="flash"></div>
  <div id="overlayLayer"></div>
  <div id="startPrompt" aria-hidden="true"><span>Click to play</span></div>
  <div id="cursor"></div>
  <div id="loadingScreen" role="status" aria-live="polite">loading...</div>

  <script>
    const video = document.getElementById("video");
    const bgmusic = document.getElementById("bgmusic");
    const flash = document.getElementById("flash");
    const overlayLayer = document.getElementById("overlayLayer");
    const startPrompt = document.getElementById("startPrompt");
    const cursor = document.getElementById("cursor");
    const loadingScreen = document.getElementById("loadingScreen");

    const idleSrc = "Mobile/idle.mp4";
    const dances = [
      { src: "Mobile/dance1.mp4", weight: 0.7 },
      { src: "Mobile/dance2.mp4", weight: 1 },
      { src: "Mobile/dance3.mp4", weight: 1 },
      { src: "Mobile/dance4.mp4", weight: 1 }
    ];

    const idleClickSets = [
      { webm: "click01.webm", mp3: "click01.mp3" },
      { webm: "click02.webm", mp3: "click02.mp3" },
      { webm: "click03.webm", mp3: "click03.mp3" },
      { webm: "click04.webm", mp3: "click04.mp3" },
      { webm: "click09.webm", mp3: "click09.mp3" },
      { webm: "click10.webm", mp3: "click10.mp3" },
      { webm: "click11.webm", mp3: "click11.mp3" }
    ];

    const danceTriggerSets = [
      { webm: "click05.webm", mp3: "click05.mp3" },
      { webm: "click06.webm", mp3: "click06.mp3" },
      { webm: "click07.webm", mp3: "click07.mp3" },
      { webm: "click08.webm", mp3: "click08.mp3" }
    ];

    const normalClickSize = 420;
    const danceClickSize = 900;
    const dance4ClickSize = 680;
    const maxActiveOverlays = 3;
    const gameStartedStorageKey = "gingerCatGameStarted";

    let state = "idle";
    let hasStartedAudio = false;
    let bgMusicStarted = false;
    let flashTimeout = null;
    let ignoreClickUntil = 0;
    let inputLocked = false;
    let currentDance = null;
    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    let activeOverlays = [];
    let activeSounds = [];
    let musicEnabled = false;
    let interactionCount = 0;
    let interactionThreshold = pickInteractionThreshold();
    let hasHiddenLoadingScreen = false;
    let slowLoadingTimeout = null;
    let idleVideoReady = false;
    let gameAssetsReady = false;
    let isAwaitingStart = false;
    let hasGameStarted = wasGamePreviouslyStarted();
    const preloadedMedia = [];

    function wasGamePreviouslyStarted() {
      try {
        return sessionStorage.getItem(gameStartedStorageKey) === "true";
      } catch (error) {
        return false;
      }
    }

    function rememberGameStarted() {
      try {
        sessionStorage.setItem(gameStartedStorageKey, "true");
      } catch (error) {
        // Storage can be unavailable when the game is opened as a local file.
      }
    }

    video.disablePictureInPicture = true;
    video.disableRemotePlayback = true;

    function isMobilePlayback() {
      return window.matchMedia("(pointer: coarse)").matches;
    }

    function shouldPlayClickSounds() {
      return musicEnabled;
    }

    function isCurrentDance(filename) {
      return currentDance && currentDance.endsWith(filename);
    }

    function applySoundState() {
      bgmusic.muted = !musicEnabled;
      video.muted = !musicEnabled || state !== "dance";
      activeOverlays.forEach((overlay) => {
        overlay.muted = !musicEnabled;
      });

      if (!musicEnabled) {
        activeSounds.forEach((sound) => {
          sound.pause();
          sound.currentTime = 0;
        });
        activeSounds = [];
      }
    }

    async function setMusicEnabled(enabled) {
      musicEnabled = enabled;
      applySoundState();

      if (isMobilePlayback()) {
        return;
      }

      if (musicEnabled && hasGameStarted) {
        await startBackgroundMusic();
      } else {
        bgmusic.pause();
      }
    }

    function hideLoadingScreen() {
      if (hasHiddenLoadingScreen) {
        return;
      }

      hasHiddenLoadingScreen = true;
      clearTimeout(slowLoadingTimeout);
      loadingScreen.classList.add("is-hidden");
      window.parent.postMessage({ type: "gameReady" }, "*");
    }

    function showStartPrompt() {
      if (isMobilePlayback()) {
        return;
      }

      isAwaitingStart = true;
      video.pause();
      video.currentTime = 0;
      startPrompt.classList.add("is-visible");
      startPrompt.setAttribute("aria-hidden", "false");
    }

    function beginGame(x, y) {
      if (!isAwaitingStart) {
        return false;
      }

      isAwaitingStart = false;
      hasGameStarted = true;
      rememberGameStarted();
      startPrompt.classList.remove("is-visible");
      startPrompt.setAttribute("aria-hidden", "true");
      video.play().catch((error) => {
        console.log("Idle play failed:", error);
      });
      startBackgroundMusic();

      if (Number.isFinite(x) && Number.isFinite(y)) {
        playIdleClickOverlay(x, y);
      }

      return true;
    }

    function showLoadingMessage(message) {
      if (!hasHiddenLoadingScreen) {
        loadingScreen.textContent = message;
      }
    }

    function finishLoadingWhenReady() {
      if (idleVideoReady && gameAssetsReady) {
        if (!hasGameStarted) {
          showStartPrompt();
        }

        hideLoadingScreen();
        resumeGame();
      }
    }

    function preloadMedia(src, kind) {
      return new Promise((resolve) => {
        const media = kind === "video" ? document.createElement("video") : new Audio();
        let settled = false;

        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          resolve();
        };

        media.preload = "auto";
        media.src = src;

        if (kind === "video") {
          media.muted = true;
          media.playsInline = true;
        }

        media.addEventListener("loadeddata", finish, { once: true });
        media.addEventListener("error", finish, { once: true });
        const timeout = window.setTimeout(finish, 15000);

        preloadedMedia.push(media);
        media.load();
      });
    }

    async function preloadGameAssets() {
      const clickSets = [...idleClickSets, ...danceTriggerSets];
      const assets = [
        ...dances.map((dance) => preloadMedia(dance.src, "video")),
        ...clickSets.map((set) => preloadMedia(set.webm, "video")),
        ...clickSets.map((set) => preloadMedia(set.mp3, "audio"))
      ];

      await Promise.all(assets);
      gameAssetsReady = true;
      finishLoadingWhenReady();
    }

    function pickInteractionThreshold() {
      return Math.floor(Math.random() * 15) + 1;
    }

    async function maybeTriggerKeyboardAction() {
      interactionCount += 1;

      if (interactionCount < interactionThreshold) {
        return;
      }

      interactionCount = 0;
      interactionThreshold = pickInteractionThreshold();
      await handleKeyboardTrigger();
    }

    function pickRandomDance() {
      if (isMobilePlayback()) {
        return Math.random() < 0.5 ? "Mobile/dance3.mp4" : "Mobile/dance4.mp4";
      }

      const totalWeight = dances.reduce((sum, dance) => sum + dance.weight, 0);
      let roll = Math.random() * totalWeight;

      for (const dance of dances) {
        roll -= dance.weight;
        if (roll <= 0) {
          return dance.src;
        }
      }

      return dances[dances.length - 1].src;
    }

    function pickRandomIdleClickSet() {
      return idleClickSets[Math.floor(Math.random() * idleClickSets.length)];
    }

    function pickRandomDanceTriggerSet() {
      if (isCurrentDance("dance1.mp4")) {
        return { webm: "click03.webm", mp3: "click03.mp3" };
      }

      return danceTriggerSets[Math.floor(Math.random() * danceTriggerSets.length)];
    }

    async function startBackgroundMusic() {
      if (isMobilePlayback() || !musicEnabled || !hasGameStarted || !hasHiddenLoadingScreen) {
        return;
      }

      if (bgMusicStarted) {
        if (musicEnabled && bgmusic.paused) {
          try {
            await bgmusic.play();
          } catch (error) {
            console.log("Music resume failed:", error);
          }
        }

        return;
      }

      bgMusicStarted = true;
      bgmusic.muted = !musicEnabled;
      bgmusic.volume = 0.6;
      bgmusic.playbackRate = 1.0;
      bgmusic.currentTime = 0;

      try {
        await bgmusic.play();
      } catch (error) {
        console.log("Music play failed:", error);
        bgMusicStarted = false;
      }
    }

    function resumeGame() {
      if (!hasGameStarted || isAwaitingStart) {
        return;
      }

      video.play().catch((error) => {
        console.log("Game resume failed:", error);
      });
      startBackgroundMusic();
    }

    function setNormalMusicEffect() {
      bgmusic.volume = 0.6;
      bgmusic.playbackRate = 1.0;
    }

    function setDance1MusicEffect() {
      bgmusic.volume = 0.35;
      bgmusic.playbackRate = 0.5;
    }

    function updateMusicEffectForCurrentState() {
      if (!bgMusicStarted) return;

      if (isCurrentDance("dance1.mp4")) {
        setDance1MusicEffect();
      } else {
        setNormalMusicEffect();
      }
    }

    function getCurrentClickSize() {
      const viewportScale = Math.min(window.innerWidth / 720, window.innerHeight / 900, 1);
      let size = normalClickSize;

      if (state === "dance" && isCurrentDance("dance4.mp4")) {
        size = dance4ClickSize;
      } else if (state === "dance") {
        size = danceClickSize;
      }

      return Math.max(180, Math.round(size * viewportScale));
    }

    function playIdle() {
      state = "idle";
      currentDance = null;
      inputLocked = false;
      updateMusicEffectForCurrentState();

      video.src = idleSrc;
      video.loop = true;
      video.muted = true;
      video.volume = 1.0;
      video.currentTime = 0;

      video.play().catch((error) => {
        console.log("Idle play failed:", error);
      });
    }

    function playDance() {
      if (inputLocked) return;

      state = "dance";
      inputLocked = true;
      hasStartedAudio = true;

      const chosenDance = pickRandomDance();
      currentDance = chosenDance;
      updateMusicEffectForCurrentState();

      video.src = chosenDance;
      video.loop = false;
      video.muted = !musicEnabled;
      video.volume = 1.0;
      video.currentTime = 0;

      video.play().catch((error) => {
        console.log("Dance play failed:", error);
      });

      startBackgroundMusic();
    }

    function flashColor(color, durationMs) {
      clearTimeout(flashTimeout);

      flash.style.background = color;
      flash.style.opacity = "0.5";

      flashTimeout = setTimeout(() => {
        flash.style.opacity = "0";
      }, durationMs);
    }

    function removeOverlay(overlay) {
      activeOverlays = activeOverlays.filter((activeOverlay) => activeOverlay !== overlay);
      overlay.pause();
      overlay.removeAttribute("src");
      overlay.load();
      overlay.remove();
    }

    function trimActiveOverlays() {
      if (isMobilePlayback()) {
        activeOverlays.forEach(removeOverlay);
        return;
      }

      while (activeOverlays.length >= maxActiveOverlays) {
        removeOverlay(activeOverlays[0]);
      }
    }

    function playOverlay(set, x, y) {
      hasStartedAudio = true;

      trimActiveOverlays();

      const overlay = document.createElement("video");
      overlay.className = "clickOverlay";
      overlay.playsInline = true;
      overlay.disablePictureInPicture = true;
      overlay.disableRemotePlayback = true;
      overlay.controlsList = "nodownload noplaybackrate noremoteplayback";
      overlay.muted = !musicEnabled;
      overlay.volume = 1.0;
      overlay.src = set.webm;
      overlay.currentTime = 0;
      overlay.loop = false;
      overlay.playbackRate = 1.25;
      overlay.style.left = x + "px";
      overlay.style.top = y + "px";
      overlay.style.width = getCurrentClickSize() + "px";

      overlay.style.backgroundColor = "transparent";
      overlay.preload = "auto";
      overlayLayer.appendChild(overlay);
      activeOverlays.push(overlay);

      if (shouldPlayClickSounds()) {
        const sound = new Audio(set.mp3);
        sound.muted = false;
        sound.volume = 0.72;
        sound.playbackRate = 1.0;
        activeSounds.push(sound);

        const removeSound = () => {
          activeSounds = activeSounds.filter((activeSound) => activeSound !== sound);
        };

        sound.addEventListener("ended", removeSound, { once: true });
        sound.addEventListener("error", removeSound, { once: true });
        sound.play().catch((error) => {
          console.log("Click sound failed:", error);
          removeSound();
        });
      }

      const revealOverlay = () => {
        overlay.style.visibility = "visible";
        overlay.style.opacity = "1";
      };

      const revealWhenReady = () => {
        if (typeof overlay.requestVideoFrameCallback === "function") {
          overlay.requestVideoFrameCallback(() => {
            revealOverlay();
          });
        } else {
          requestAnimationFrame(() => {
            revealOverlay();
          });
        }
      };

      overlay.addEventListener("playing", revealWhenReady, { once: true });

      overlay.play().catch((error) => {
        console.log("Overlay play failed:", error);
        removeOverlay(overlay);
      });

      overlay.addEventListener("ended", () => {
        removeOverlay(overlay);
      });

      overlay.addEventListener("error", () => {
        removeOverlay(overlay);
      });
    }

    function playIdleClickOverlay(x, y) {
      playOverlay(pickRandomIdleClickSet(), x, y);
    }

    function playDanceTriggerOverlay(x, y) {
      playOverlay(pickRandomDanceTriggerSet(), x, y);
    }

    function playKeyOverlay() {
      playDanceTriggerOverlay(cursorX, cursorY);
    }

    async function handleKeyboardTrigger() {
      if (state === "idle") {
        playDance();
      } else {
        playKeyOverlay();
        if (isCurrentDance("dance1.mp4")) {
          flashColor("red", 200);
        }

        startBackgroundMusic();
      }
    }

    async function handleMouseClick(x, y) {
      if (state === "idle") {
        playIdleClickOverlay(x, y);
      } else {
        playDanceTriggerOverlay(x, y);
        if (isCurrentDance("dance1.mp4")) {
          flashColor("red", 200);
        }
      }

      startBackgroundMusic();
    }

    async function handleTouch(x, y) {
      cursorX = x;
      cursorY = y;

      if (isMobilePlayback()) {
        await handleMouseClick(x, y);
        await maybeTriggerKeyboardAction();
        return;
      }

      await handleMouseClick(x, y);
      await maybeTriggerKeyboardAction();
    }

    video.addEventListener("ended", () => {
      if (state === "dance") {
        playIdle();
      }
    });

    const markIdleVideoReady = () => {
      idleVideoReady = true;
      finishLoadingWhenReady();
    };

    video.addEventListener("canplay", markIdleVideoReady, { once: true });
    video.addEventListener("playing", markIdleVideoReady, { once: true });
    video.addEventListener("error", () => {
      showLoadingMessage("The game could not load. Please refresh and try again.");
    }, { once: true });
    window.addEventListener("offline", () => {
      showLoadingMessage("You appear to be offline. The game needs an internet connection.");
    });
    slowLoadingTimeout = window.setTimeout(() => {
      showLoadingMessage("slow connection");
    }, 6000);

    document.addEventListener("click", async (event) => {
      if (Date.now() < ignoreClickUntil) return;
      if (beginGame(event.clientX, event.clientY)) return;
      await handleMouseClick(event.clientX, event.clientY);
      await maybeTriggerKeyboardAction();
    });

    document.addEventListener("contextmenu", async (event) => {
      event.preventDefault();
      if (Date.now() < ignoreClickUntil) return;
      if (beginGame()) return;
      await handleMouseClick(event.clientX, event.clientY);
      await maybeTriggerKeyboardAction();
    });

    document.addEventListener("keydown", async () => {
      if (beginGame()) return;
      await handleMouseClick(cursorX, cursorY);
      await maybeTriggerKeyboardAction();
    });

    document.addEventListener("touchstart", async (event) => {
      event.preventDefault();
      ignoreClickUntil = Date.now() + 700;
      cursor.style.display = "none";
      const touch = event.touches[0];

      if (touch) {
        await handleTouch(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    document.addEventListener("mousemove", (event) => {
      cursorX = event.clientX;
      cursorY = event.clientY;
      cursor.style.display = "block";
      cursor.style.left = cursorX + "px";
      cursor.style.top = cursorY + "px";
    });

    document.addEventListener("mouseleave", () => {
      cursor.style.display = "none";
    });

    window.addEventListener("blur", () => {
      cursor.style.display = "none";
    });

    window.addEventListener("message", (event) => {
      if (!event.data) {
        return;
      }

      if (event.data.type === "setMusic") {
        setMusicEnabled(Boolean(event.data.enabled));
      } else if (event.data.type === "triggerSoundButtonClick") {
        playIdleClickOverlay(window.innerWidth - 90, window.innerHeight - 90);
      } else if (event.data.type === "resumeGame") {
        resumeGame();
      }
    });

    window.addEventListener("pageshow", resumeGame);
    window.setGameMusicEnabled = setMusicEnabled;

    preloadGameAssets();
    playIdle();
  </script>
</body>
</html>
